  <!-- Theme Initializer (Zero Flash - Default Light Mode) -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('dsg_theme');
        if (savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
